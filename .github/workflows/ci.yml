name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: pnpm dlx @lhci/cli@0.14.0 autorun

  links:
    name: Link check
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Serve the built site
        run: |
          pnpm preview --host 127.0.0.1 --port 4321 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4321/NovaXRLacrosse/ > /dev/null && exit 0
            sleep 1
          done
          echo "Preview server did not start" && exit 1
      - uses: lycheeverse/lychee-action@v2
        with:
          # The canonical and og:url tags point at the live site, which 404s until the first deploy
          args: >-
            --no-progress --include-fragments
            --exclude '^https://xrlacrosse-nova\.github\.io/'
            http://127.0.0.1:4321/NovaXRLacrosse/
          fail: true
